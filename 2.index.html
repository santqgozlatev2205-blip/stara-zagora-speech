<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>STARA ZAGORA SPEECH – Line 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#008000">
<script src="sw-reg.js" defer></script>

<style>
:root{--bg:#fff;--text:#000;--arrow:#007bff;--current:#e60000;--next:#008000;--target:#ffa500;--gray:#ccc}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial;text-align:center;padding:40px 20px}
.back-btn{position:absolute;top:8px;left:8px;z-index:100;padding:6px 12px;font-size:14px;background:#008000;color:#fff;border:none;border-radius:4px;cursor:pointer}
header{margin-bottom:20px}
#lineBar{display:flex;align-items:center;padding:8px;font-weight:bold;font-size:20px;background:#008000;color:#000}
#lineNum{background:#008000;color:#000;font-size:48px;width:90px;text-align:center}
#dirWrap{width:100%;overflow:hidden;white-space:nowrap}
#dirText{display:inline-block;padding-left:100%;white-space:nowrap;animation:scroll 15s linear infinite;font-size:18px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
select{width:90%;max-width:400px;margin:10px auto;display:block;padding:10px;font-size:16px;background:var(--bg);color:var(--text);border:1px solid var(--gray)}
.stopRow{display:flex;align-items:center;padding:4px 0}
.stopArrow{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--arrow);margin-right:8px;flex-shrink:0}
.stop{font-size:18px}
.stop.current{color:var(--current);font-weight:bold}
.stop.next{color:var(--next)}
.stop.target{color:var(--target);font-weight:bold}
#label,#labelName{text-align:center;margin-top:10px;font-size:20px}
#label.current{color:var(--current)}
#label.next{color:var(--next)}
#clock{text-align:center;font-size:16px;color:#555;margin-top:5px}
#popup{position:fixed;bottom:20px;left:5%;width:90%;background:#ffa500;color:#000;padding:15px;display:none;text-align:center;font-size:18px}
</style>
</head>

<body>
<button class="back-btn" onclick="location.href='menu.html'">Назад</button>

<header>
  <div>STARA ZAGORA SPEECH</div>
  <div>Автор: Кирил Кирилов | ivanovkiko72@gmail.com</div>
  <div id="clock"></div>
</header>

<div id="lineBar">
  <div id="lineNum">2</div>
  <div id="dirWrap"><div id="dirText">Изберете посока</div></div>
</div>

<select id="directionSelect">
  <option value="">Избери посока</option>
  <option value="zora_jheleznik">Стадион Берое - Мототехника</option>
  <option value="jheleznik_zora">Мототехника - Стадион Берое</option>
</select>

<select id="targetSelect">
  <option value="">Избери крайна спирка</option>
</select>

<div id="label"></div>
<div id="labelName"></div>
<div id="stops"></div>
<div id="popup"></div>

<script>
/* ---------------- AUDIO QUEUE ---------------- */
let aq=[],playing=false;
function playQueue(list){
 aq.push(...list);
 if(!playing) playNext();
}
function playNext(){
 if(!aq.length){playing=false;return;}
 playing=true;
 const a=new Audio(aq.shift());
 a.onended=playNext;
 a.play().catch(()=>{});
}

/* ---------------- STATE ---------------- */
let route=[],currentIndex=-1,nextIndex=-1,targetIndex=null;
let watchId=null;
let popupInterval=null;

/* ---------------- DISTANCE ---------------- */
function dist(a,b){
 const R=6371000;
 const dLat=(b.lat-a.lat)*Math.PI/180;
 const dLon=(b.lon-a.lon)*Math.PI/180;
 const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
 const x=Math.sin(dLat/2)**2+
 Math.sin(dLon/2)**2*Math.cos(la1)*Math.cos(la2);
 return 2*R*Math.asin(Math.sqrt(x));
}

/* ---------------- ROUTES ---------------- */
const stadion_beroe_mototekhnika = [
{name:"Стадион Берое",lat:42.43073142193363,lon:25.617257953702808,a:"stadion_beroe"},
{name:"Жабките",lat:42.43125958525303,lon:25.62159087588618,a:"jabkite"},
{name:"Детска поликлиника",lat:42.430390519158884,lon:25.626260582970453,a:"detska_poliklinika"},
{name:"ГПЧЕ Ромен Ролан",lat:42.42856030354633,lon:25.62919404868408,a:"gpche_rolan"},
{name:"ОД на МВР",lat:42.42866564298327,lon:25.63346764086084,a:"od_mvr"},
{name:"Втора аптека",lat:42.424838842950855,lon:25.634679804305534,a:"vtora_apteka"},
{name:"Топливо",lat:42.41628932369705,lon:25.637639456585177,a:"toplivo"},
{name:"м-н Багира",lat:42.41284723432029,lon:25.63869245759115,a:"bagira"},
{name:"НПГВМ Иван Павлов",lat:42.408738298726156,lon:25.639944859145228,a:"npggvm_pavlov"},
{name:"Кольо Ганчев 1",lat:42.40374888321123,lon:25.64229056513118,a:"kolyo_ganchev_1"},
{name:"Радост",lat:42.400994022212814,lon:25.643451161923462,a:"radost"},
{name:"Загоре",lat:42.39841878070093,lon:25.645121232643618,a:"zagore"},
{name:"Мототехника",lat:42.39644379179119,lon:25.656383372973796,a:"mototekhnika"}
];

const mototekhnika_stadion_beroe = [
{name:"Мототехника",lat:42.39648538865692,lon:25.656949319052163,a:"mototekhnika"},
{name:"Загоре",lat:42.39778075776289,lon:25.64780770333055,a:"zagore"},
{name:"Тракия",lat:42.39920587786678,lon:25.64432303368201,a:"trakiya"},
{name:"Радост",lat:42.40191332708434,lon:25.64342513228571,a:"radost"},
{name:"Кольо Ганчев 1",lat:42.40429578851736,lon:25.64236524980339,a:"kolyo_ganchev_1"},
{name:"АПК",lat:42.40869480802293,lon:25.640326894160005,a:"apk"},
{name:"м-н Баумакс",lat:42.41352120216423,lon:25.63882005737577,a:"baumaks"},
{name:"Бисер Олива",lat:42.41663913996451,lon:25.637825724850458,a:"biser_oliva"},
{name:"МБАЛ Св. Иван Рилски",lat:42.42382080694189,lon:25.635289696241813,a:"mbal_ivan_rilski"},
{name:"м-н Перун",lat:42.42730320797607,lon:25.6342078585832,a:"perun"},
{name:"ГПЧЕ Ромен Ролан",lat:42.42874654908655,lon:25.62944452642377,a:"gpche_rolan"},
{name:"ДНА",lat:42.4310812040043,lon:25.626180282309104,a:"dna"},
{name:"Кипарис",lat:42.431335151142676,lon:25.6211720918523,a:"kiparis"},
{name:"Стадион Берое",lat:42.431133040970415,lon:25.61711481849596,a:"stadion_beroe"}
];

const routes={
2:{stadion_beroe_mototekhnika,mototekhnika_stadion_beroe}
};

const routes={stadion_beroe_mototekhnika,mototekhnika_stadion_beroe};

/* ---------------- UI + GPS ---------------- */
const dirSel=document.getElementById("directionSelect");
const targetSel=document.getElementById("targetSelect");
const stopsDiv=document.getElementById("stops");
const label=document.getElementById("label");
const labelName=document.getElementById("labelName");

dirSel.onchange=()=>{
 if(!routes[dirSel.value])return;
 route=routes[dirSel.value];
 document.getElementById("dirText").innerText=dirSel.options[dirSel.selectedIndex].text;
 const audioFile = dirSel.value === 'stadion_beroe_mototekhnika'
   ? 'stadion_beroe_mototekhnika.mp3'
   : 'mototekhnika_stadion_beroe.mp3';
 playQueue(["line.mp3","2.mp3","direction.mp3",audioFile]);
 renderStops();
 startGPS();
};

targetSel.onchange=()=>{targetIndex=parseInt(targetSel.value);renderStops();};

function renderStops(){
 stopsDiv.innerHTML="";
 targetSel.innerHTML="<option value=''>Избери крайна спирка</option>";
 const start=(currentIndex<0?0:currentIndex);
 route.forEach((s,i)=>{
  if(i<start)return;
  if(targetIndex!==null && i>targetIndex)return;
  let row=document.createElement("div");
  row.className="stopRow";
  let arr=document.createElement("div");
  arr.className="stopArrow";
  let txt=document.createElement("div");
  txt.className="stop";
  if(i===currentIndex)txt.classList.add("current");
  else if(i===nextIndex)txt.classList.add("next");
  else if(i===targetIndex)txt.classList.add("target");
  txt.innerText=s.name;
  row.appendChild(arr);
  row.appendChild(txt);
  stopsDiv.appendChild(row);
  let o=document.createElement("option");
  o.value=i;o.text=s.name;
  targetSel.appendChild(o);
 });
}

function startGPS(){
 if(watchId)navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(onPos,()=>{},{
  enableHighAccuracy:true,
  maximumAge:0,
  timeout:5000,
  distanceFilter:1
 });
}

function onPos(p){
 const me={lat:p.coords.latitude,lon:p.coords.longitude};
 route.forEach((s,i)=>{
  const d=dist(me,s);
  // текуща спирка – радиус 10 м
  if(d<=10&&currentIndex!==i){
   currentIndex=i;nextIndex=i+1;
   const isFinal=(i===targetIndex);
   label.className="current";label.innerText="СПИРКА / BUS STOP";labelName.innerText=s.name;
   const queue=["stop.mp3",s.a+".mp3"];if(isFinal)queue.push("your_stop.mp3");
   playQueue(queue);notifyUser("Спирка",s.name,isFinal);
   if(isFinal)showFinalPopup();
   renderStops();
  }
  // следваща спирка – радиус над 5 м от текущата
  if(currentIndex===i&&d>=5&&nextIndex!==i+1&&i+1<route.length){
   nextIndex=i+1;
   const ns=route[nextIndex];
   const isFinal=(nextIndex===targetIndex);
   label.className="next";label.innerText="СЛЕДВАЩА СПИРКА / NEXT STOP";labelName.innerText=ns.name;
   const queue=["next_stop.mp3",ns.a+".mp3"];if(isFinal)queue.push("your_stop.mp3");
   playQueue(queue);notifyUser("Следваща спирка",ns.name,isFinal);
   if(isFinal)showFinalPopup();
   renderStops();
  }
 });
}

function notifyUser(title,body,isFinal){
  if(!navigator.serviceWorker?.controller) return;
  if(Notification.permission!=='granted') return;
  const audioFile=isFinal?'your_stop.mp3':(title==='Спирка'?'stop.mp3':'next_stop.mp3');
  navigator.serviceWorker.controller.postMessage({type:'PLAY',file:audioFile});
  navigator.serviceWorker.controller.postMessage({type:'PUSH',title,body});
}

function showFinalPopup(){
 if(popupInterval)return;
 const p=document.getElementById("popup");
 let bg=true;
 p.style.display="block";
 popupInterval=setInterval(()=>{
  p.innerText=bg
   ?"МОЛЯ, НАТИСНЕТЕ БУТОНА СТОП ИЛИ ВРАТА ЗА ДА СИГНАЛИЗИРАТЕ НА ШОФЬОРА"
   :"PLEASE PRESS THE STOP OR DOOR BUTTON TO SIGNAL THE DRIVER";
  bg=!bg;
 },7000);
}

/* ---------------- CLOCK BG/EN ---------------- */
const daysBg=["Неделя","Понеделник","Вторник","Сряда","Четвъртък","Петък","Събота"];
const daysEn=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const monthsBg=["януари","февруари","март","април","май","юни","юли","август","септември","октомври","ноември","декември"];
const monthsEn=["January","February","March","April","May","June","July","August","September","October","November","декември"];

let langClock=true;
setInterval(()=>{
 const now=new Date();
 const d=langClock?daysBg[now.getDay()]:daysEn[now.getDay()];
 const m=langClock?monthsBg[now.getMonth()]:monthsEn[now.getMonth()];
 const str=`${now.getDate()} ${m} ${now.getFullYear()} г. – ${d} – ${now.toLocaleTimeString("bg-BG")}`;
 document.getElementById("clock").innerText=str;
 langClock=!langClock;
},3000);

/* --- автоматично презареждане при нова версия --- */
navigator.serviceWorker.register('sw.js').then(reg=>{
 reg.addEventListener('updatefound',()=>{
   const newWorker=reg.installing;
   newWorker.addEventListener('statechange',()=>{
     if(newWorker.state==='activated'&&navigator.serviceWorker.controller){
       window.location.reload();
     }
   });
 });
});

/* --- приемаме звук от SW --- */
navigator.serviceWorker.addEventListener('message',e=>{
 if(e.data.type==='PLAY'){
   const a=new Audio(e.data.file);
   a.play().catch(()=>{});
 }
});
</script>
</body>
</html>
