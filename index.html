<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>STARA ZAGORA SPEECH</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    background:black;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}
header {
    text-align:center;
    padding:10px;
}
h1 {
    color:orange;
    margin:5px 0;
}
#line {
    display:flex;
    align-items:center;
    padding:10px;
}
#lineNumber {
    background:green;
    color:white;
    font-size:48px;
    width:90px;
    text-align:center;
}
#directionText {
    margin-left:10px;
    font-size:18px;
}
button {
    width:90%;
    margin:10px auto;
    display:block;
    padding:12px;
    font-size:18px;
}
select {
    width:90%;
    margin:10px auto;
    display:block;
    padding:10px;
    font-size:16px;
}
.stop {
    padding:8px 12px;
    border-bottom:1px solid #333;
}
.current { color:lime; }
.next { color:yellow; }
.target { color:orange; font-weight:bold; }
#popup {
    position:fixed;
    bottom:20px;
    left:10%;
    width:80%;
    background:orange;
    color:black;
    padding:15px;
    text-align:center;
    display:none;
}
</style>
</head>

<body>

<header>
<h1>STARA ZAGORA SPEECH</h1>
<div>Автор: Кирил Кирилов · E-mail: ivanovkiko72@gmail.com</div>
<div id="date"></div>
</header>

<div id="line">
<div id="lineNumber">71</div>
<div id="directionText">Изчакване на GPS...</div>
</div>

<button onclick="enableSound()">🔊 Включи звук</button>

<select id="directionSelect" onchange="setDirection(this.value)">
<option value="">Избери посока</option>
<option value="zora_jheleznik">кв. Зора → кв. Железник през Стадион Берое</option>
<option value="jheleznik_zora">кв. Железник → кв. Зора през Стадион Берое</option>

<select id="targetSelect"></select>

<div id="stops"></div>

<div id="popup"></div>

<script>
let soundEnabled=false;
function play(name){
 if(!soundEnabled) return;
 new Audio(name+".mp3").play();
}
function enableSound(){
 soundEnabled=true;
 play("line"); play("71"); play("direction");
}

const daysBG=["Неделя","Понеделник","Вторник","Сряда","Четвъртък","Петък","Събота"];
const daysEN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let langBG=true;

setInterval(()=>{
 let d=new Date();
 let day=langBG?daysBG[d.getDay()]:daysEN[d.getDay()];
 document.getElementById("date").innerText=
 day+" "+d.toLocaleDateString()+" "+d.toLocaleTimeString();
 langBG=!langBG;
},3000);

const routes={

};

let activeRoute=[];
function setDirection(dir){
 activeRoute=routes[dir];
 renderStops();
}

function renderStops(){
 const c=document.getElementById("stops");
 const t=document.getElementById("targetSelect");
 c.innerHTML=""; t.innerHTML="<option>Избери крайна спирка</option>";
 activeRoute.forEach((s,i)=>{
  let d=document.createElement("div");
  d.className="stop";
  d.innerText=s.n;
  c.appendChild(d);
  let o=document.createElement("option");
  o.value=i; o.text=s.n;
  t.appendChild(o);
 });
}

</script>
</body>
</html>
