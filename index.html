let active=[],targetIndex=null,currentIndex=-1;

document.getElementById("directionSelect").onchange=e=>{
 active=routes[e.target.value];
 render();
};

function render(){
 const s=document.getElementById("stops");
 const t=document.getElementById("targetSelect");
 s.innerHTML=""; t.innerHTML="<option value=''>Избери крайна спирка</option>";
 active.forEach((st,i)=>{
  let d=document.createElement("div");
  d.className="stop";
  d.innerText=st.name;
  s.appendChild(d);
  let o=document.createElement("option");
  o.value=i;o.text=st.name;
  t.appendChild(o);
 });
}

document.getElementById("targetSelect").onchange=e=>{
 targetIndex=parseInt(e.target.value);
 renderState();
};

function renderState(){
 document.querySelectorAll(".stop").forEach((d,i)=>{
  d.className="stop";
  if(i===currentIndex)d.classList.add("current");
  if(i===currentIndex+1)d.classList.add("next");
  if(i===targetIndex)d.classList.add("target");
 });
 if(currentIndex+1===targetIndex){
  playSeq(["next_stop",active[targetIndex].a,"your_stop"]);
  showPopup();
 }
}

function showPopup(){
 const p=document.getElementById("popup");
 let bg=true;
 p.style.display="block";
 setInterval(()=>{
  p.innerText=bg?
 "СЛЕДВАЩАТА СПИРКА Е ВАШАТА. МОЛЯ НАТИСНЕТЕ БУТОНА СТОП ИЛИ ВРАТА.":

}

<script>
/* ---------- GPS ЛОГИКА ---------- */

let watchId=null;

function distance(lat1,lon1,lat2,lon2){
 const R=6371000;
 const dLat=(lat2-lat1)*Math.PI/180;
 const dLon=(lon2-lon1)*Math.PI/180;
 const a=Math.sin(dLat/2)**2+
 Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
 Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function startGPS(){
 if(!navigator.geolocation) return;
 watchId=navigator.geolocation.watchPosition(pos=>{
  const {latitude,longitude}=pos.coords;
  checkStops(latitude,longitude);
 },()=>{},{
  enableHighAccuracy:true,
  maximumAge:0,
  timeout:5000
 });
}

function checkStops(lat,lon){
 if(!active.length) return;

 active.forEach((st,i)=>{
  const d=distance(lat,lon,st.lat,st.lon);

  // ТЕКУЩА спирка – 10м
  if(d<=10 && i!==currentIndex){
   currentIndex=i;
   playSeq(["stop",st.a]);
   renderState();
  }

  // СЛЕДВАЩА спирка – 5м след напускане
  if(i===currentIndex+1 && d<=5){
   playSeq(["next_stop",st.a]);
   renderState();
  }
 });
}

/* ---------- АВТО ПОСОКА ---------- */

function autoDetectDirection(lat,lon){
 let d1=distance(lat,lon,
 routes.zora_jheleznik[0].lat,
 routes.zora_jheleznik[0].lon);

 let d2=distance(lat,lon,
 routes.jheleznik_zora[0].lat,
 routes.jheleznik_zora[0].lon);

 let dir=d1<d2?"zora_jheleznik":"jheleznik_zora";
 document.getElementById("directionSelect").value=dir;
 active=routes[dir];
 render();
 playSeq(["direction",dir]);
}

navigator.geolocation.getCurrentPosition(pos=>{
 autoDetectDirection(pos.coords.latitude,pos.coords.longitude);
 startGPS();
});

/* ---------- FALLBACK ---------- */

setInterval(()=>{
 if(!watchId && active.length){
  startGPS();
 }
},10000);

</script>
