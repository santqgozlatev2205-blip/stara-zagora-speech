<style>
:root{
  --bg:#fff;
  --text:#000;
  --arrow:#007bff;
  --current:#e60000;
  --next:#008000;
  --target:#ffa500;
  --gray:#ccc;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial}
header{text-align:center;padding:10px;font-size:14px}

/* ---- скролираща се посока ---- */
#lineBar{display:flex;align-items:center;padding:8px;font-weight:bold;font-size:20px}
#lineNum{background:#008000;color:#000;font-size:48px;width:90px;text-align:center}
#dirWrap{overflow:hidden;width:100%;margin-left:10px}
#dirText{white-space:nowrap;animation:scroll 15s linear infinite;font-size:18px}
@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

select{width:95%;margin:10px auto;display:block;padding:10px;font-size:16px;background:var(--bg);color:var(--text);border:1px solid var(--gray)}

/* ---- спирки + стрелки ---- */
.stopWrap{position:relative;padding:8px 0}
.stopArrow{height:4px;background:var(--arrow);margin:4px 0}
.stop{font-size:18px}
.stop.current{color:var(--current);font-weight:bold}
.stop.next   {color:var(--next)}
.stop.target {color:var(--target);font-weight:bold}

#label,#labelName{text-align:center;margin-top:10px;font-size:20px}
#label.current{color:var(--current)}
#label.next   {color:var(--next)}
#clock{text-align:center;font-size:16px;color:#555;margin-top:5px}

#popup{
  position:fixed;bottom:20px;left:5%;width:90%;
  background:#ffa500;color:#000;padding:15px;
  display:none;text-align:center;font-size:18px
}
</style>
</head>

<script>
/* ---------------- AUDIO QUEUE ---------------- */
let aq=[],playing=false;
function playQueue(list){
 aq.push(...list);
 if(!playing) playNext();
}
function playNext(){
 if(!aq.length){playing=false;return;}
 playing=true;
 const a=new Audio(aq.shift());
 a.onended=playNext;
 a.play();
}

/* ---------------- STATE ---------------- */
let route=[],currentIndex=-1,nextIndex=-1,targetIndex=null;
let watchId=null;
let popupInterval=null;

/* ---------------- DISTANCE ---------------- */
function dist(a,b){
 const R=6371000;
 const dLat=(b.lat-a.lat)*Math.PI/180;
 const dLon=(b.lon-a.lon)*Math.PI/180;
 const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
 const x=Math.sin(dLat/2)**2+
 Math.sin(dLon/2)**2*Math.cos(la1)*Math.cos(la2);
 return 2*R*Math.asin(Math.sqrt(x));
}

const routes={zora_jheleznik,jheleznik_zora};

/* ---------------- UI + GPS ---------------- */
const dirSel=document.getElementById("directionSelect");
const targetSel=document.getElementById("targetSelect");
const stopsDiv=document.getElementById("stops");
const label=document.getElementById("label");
const labelName=document.getElementById("labelName");

dirSel.onchange=()=>{
 if(!routes[dirSel.value])return;
 route=routes[dirSel.value];
 document.getElementById("dirText").innerText=dirSel.options[dirSel.selectedIndex].text;
 const audioFile = dirSel.value === 'zora_jheleznik'
   ? 'zora_jheleznik_stadion_beroe.mp3'
   : 'jheleznik_zora_stadion_beroe.mp3';
 playQueue(["line.mp3","71.mp3","direction.mp3",audioFile]);
 renderStops();
 startGPS();
};

targetSel.onchange=()=>{
 targetIndex=parseInt(targetSel.value);
 renderStops();
};

function renderStops(){
 stopsDiv.innerHTML="";
 targetSel.innerHTML="<option value=''>Избери крайна спирка</option>";
 const start=(currentIndex<0?0:currentIndex);
 route.forEach((s,i)=>{
  if(i<start)return;
  if(targetIndex!==null && i>targetIndex)return;

  /* стрелка преди спирката */
  if(i>start){
   let arr=document.createElement("div");
   arr.className="stopArrow";
   stopsDiv.appendChild(arr);
  }

  let d=document.createElement("div");
  d.className="stop";
  if(i===currentIndex)d.classList.add("current");
  else if(i===nextIndex)d.classList.add("next");
  else if(i===targetIndex)d.classList.add("target");
  d.innerText=s.name;
  stopsDiv.appendChild(d);

  let o=document.createElement("option");
  o.value=i;o.text=s.name;
  targetSel.appendChild(o);
 });
}

function startGPS(){
 if(watchId)navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(onPos,()=>{},{
  enableHighAccuracy:true,maximumAge:0,timeout:10000
 });
}

function onPos(p){
 const me={lat:p.coords.latitude,lon:p.coords.longitude};
 route.forEach((s,i)=>{
  const d=dist(me,s);
  if(d<=10 && currentIndex!==i){
   currentIndex=i;nextIndex=i+1;
   label.className="current";
   label.innerText="СПИРКА / BUS STOP";
   labelName.innerText=s.name;
   playQueue(["stop.mp3",s.a+".mp3"]);
   if(i===targetIndex) showFinalPopup();
   renderStops();
  }
  if(currentIndex===i && d>=5 && nextIndex!==i+1 && i+1<route.length){
   nextIndex=i+1;
   const ns=route[nextIndex];
   label.className="next";
   label.innerText="СЛЕДВАЩА СПИРКА / NEXT STOP";
   labelName.innerText=ns.name;
   playQueue(["next_stop.mp3",ns.a+".mp3"]);
   if(nextIndex===targetIndex) showFinalPopup();
   renderStops();
  }
 });
}

function showFinalPopup(){
 if(popupInterval)return;
 const p=document.getElementById("popup");
 let bg=true;
 p.style.display="block";
 popupInterval=setInterval(()=>{
  p.innerText=bg
   ?"МОЛЯ, НАТИСНЕТЕ БУТОНА СТОП ИЛИ ВРАТА ЗА ДА СИГНАЛИЗИРАТЕ НА ШОФЬОРА"
   :"PLEASE PRESS THE STOP OR DOOR BUTTON TO SIGNAL THE DRIVER";
  bg=!bg;
 },7000);
}

/* ---------------- CLOCK BG/EN ---------------- */
const daysBg=["Неделя","Понеделник","Вторник","Сряда","Четвъртък","Петък","Събота"];
const daysEn=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const monthsBg=["януари","февруари","март","април","май","юни","юли","август","септември","октомври","ноември","декември"];
const monthsEn=["January","February","March","April","May","June","July","August","September","October","November","December"];

let langClock=true;
setInterval(()=>{
 const now=new Date();
 const d=langClock?daysBg[now.getDay()]:daysEn[now.getDay()];
 const m=langClock?monthsBg[now.getMonth()]:monthsEn[now.getMonth()];
 const str=`${now.getDate()} ${m} ${now.getFullYear()} г. – ${d} – ${now.toLocaleTimeString("bg-BG")}`;
 document.getElementById("clock").innerText=str;
 langClock=!langClock;
},3000);
</script>
