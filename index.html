<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARA ZAGORA SPEECH</title>

<style>
body{margin:0;font-family:Arial;background:#000;color:#fff}

/* PROJECT */
.project{
 text-align:center;
 background:#111;
 padding:6px;
 font-size:14px
}
.project strong{color:#ff9800}

/* DAY */
.dayBox{
 text-align:center;
 font-size:26px;
 font-weight:bold;
 margin:6px 0
}

/* HEADER */
.header{display:flex;align-items:center;height:70px;overflow:hidden}
.line{
 background:#0a7d13;
 font-size:42px;
 font-weight:bold;
 padding:0 18px;
 height:100%;
 display:flex;
 align-items:center;
 flex-shrink:0
}
.dirWrap{flex:1;overflow:hidden;position:relative;height:100%}
.dir{
 position:absolute;
 white-space:nowrap;
 font-size:20px;
 line-height:70px;
 padding-left:100%;
 animation:scroll 20s linear infinite
}
@keyframes scroll{
 from{transform:translateX(0)}
 to{transform:translateX(-100%)}
}

/* UI */
button{width:95%;margin:10px;padding:12px;font-size:18px}
.info{text-align:center;font-size:22px;margin:8px}
select{width:95%;margin:10px;font-size:18px;background:#000;color:#fff}

ul{list-style:none;padding:0;margin:0}
li{padding:8px 14px;border-bottom:1px solid #222}
.current{color:#ff4d4d}
.next{color:#6bff6b}
.end{color:orange}

.time{text-align:center;font-size:16px;opacity:.7;margin:10px}

/* POPUP */
#popup{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#ff9800;
 color:#000;
 padding:14px;
 border-radius:10px;
 font-size:14px;
 text-align:center;
 display:none;
 max-width:90%
}
</style>
</head>

<body>

<div class="project">
 <strong>STARA ZAGORA SPEECH</strong><br>
 Автор: Кирил Кирилов · E-mail: ivanovkiko72@gmail.com
</div>

<div class="dayBox" id="dayBox"></div>

<div class="header">
 <div class="line">71</div>
 <div class="dirWrap">
  <div class="dir">кв. Зора – кв. Железник през Стадион Берое</div>
 </div>
</div>

<button id="audioBtn">🔊 Включи звук</button>

<div class="info" id="label">Спирка / Bus stop</div>
<div class="info" id="currentStop"></div>

<select id="endSelect"></select>
<ul id="route"></ul>

<div class="time" id="time"></div>
<div id="popup"></div>

<script>
/* ===== DAYS BG / EN ===== */
const daysBG=["Неделя","Понеделник","Вторник","Сряда","Четвъртък","Петък","Събота"];
const daysEN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let dayBG=true;
setInterval(()=>{
 const d=new Date(), i=d.getDay();
 dayBox.textContent = dayBG ? daysBG[i] : daysEN[i];
 dayBG=!dayBG;
},3000);

/* ===== TIME ===== */
setInterval(()=>{
 time.textContent = new Date().toLocaleString("bg-BG",{
  day:"2-digit",month:"2-digit",year:"numeric",
  hour:"2-digit",minute:"2-digit"
 });
},1000);

/* ===== STOPS (26) ===== */
const stops=[ /* същите 26 спирки както преди */ 
{name:"Зора - Обръщало",lat:42.424226,lon:25.68831,file:"zora_obrushtalo"},
{name:"Зора - 2",lat:42.4265,lon:25.6875,file:"zora_2"},
{name:"Зора - 1",lat:42.4281,lon:25.686,file:"zora_1"},
{name:"Метро Зора",lat:42.43087,lon:25.68417,file:"metro_zora"},
{name:"Спирка",lat:42.4315,lon:25.683,file:"spirka"},
{name:"СБА",lat:42.432,lon:25.682,file:"sba"},
{name:"Спортна зала",lat:42.428153,lon:25.658405,file:"sportna_zala"},
{name:"ДЗУ",lat:42.427892,lon:25.653642,file:"dzu"},
{name:"Крайречен изток",lat:42.431329,lon:25.643576,file:"krairechen_iztok"},
{name:"Техникуми север",lat:42.431909,lon:25.640756,file:"tehnikumi_sever"},
{name:"Кауфланд Бедечка изток",lat:42.434173,lon:25.637058,file:"kaufland_bedechka_iztok"},
{name:"ПЗ Загорка запад",lat:42.441585,lon:25.633277,file:"pz_zagorka_zapad"},
{name:"Мол Галерия",lat:42.43812,lon:25.631661,file:"mol_galeria"},
{name:"ТД на НАП",lat:42.434237,lon:25.628527,file:"nap"},
{name:"Кипарис",lat:42.431285,lon:25.620854,file:"kiparis"},
{name:"Стадион Берое",lat:42.431219,lon:25.617108,file:"stadion_beroe"},
{name:"Спортна 1",lat:42.428664,lon:25.616594,file:"sportna_1"},
{name:"Млечна кухня",lat:42.426005,lon:25.61107,file:"mlechna_kuhnia"},
{name:"Неолитни жилища",lat:42.424834,lon:25.609599,file:"neolitni_jilishta"},
{name:"Три чучура",lat:42.4179,lon:25.605246,file:"tri_chuchura"},
{name:"Железник изток 2",lat:42.415722,lon:25.599217,file:"jheleznik_iztok_2"},
{name:"Железник изток 1",lat:42.414581,lon:25.596919,file:"jheleznik_iztok_1"},
{name:"Железник РПУ",lat:42.412772,lon:25.592275,file:"jheleznik_rpu"},
{name:"СОУ Железник",lat:42.412613,lon:25.586999,file:"sou_jheleznik"},
{name:"Железник - 2",lat:42.410353,lon:25.587765,file:"jheleznik_2"},
{name:"Железник - Обръщало",lat:42.410706,lon:25.592148,file:"jheleznik_obrushtalo"}
];

/* ===== LOGIC ===== */
const CURRENT_RADIUS=0.00009, LEAVE_RADIUS=0.000045;
let cur=0,end=stops.length-1,audio=false,stopDone=false,nextDone=false;
let popupInt=null,popupBG=true;

/* AUDIO */
function playSeq(a){
 let i=0, au=new Audio(a[0]);
 au.onended=()=>{i++;if(i<a.length){au.src=a[i];au.play();}};
 au.play();
}
audioBtn.onclick=()=>{
 if(audio) return;
 audio=true;
 playSeq(["line.mp3","71.mp3","direction.mp3","zora_jheleznik_stadion_beroe.mp3"]);
};

/* POPUP */
function showPopup(){
 popup.style.display="block";
 popupInt=setInterval(()=>{
  popup.textContent = popupBG
   ?"СЛЕДВАЩАТА СПИРКА Е ВАШАТА. МОЛЯ СИГНАЛИЗИРАЙТЕ НА ШОФЬОРА С БУТОН „СТОП“ ИЛИ „ВРАТА“."
   :"THE NEXT STOP IS YOURS. PLEASE SIGNAL THE DRIVER USING THE STOP OR DOOR BUTTON.";
  popupBG=!popupBG;
 },7000);
}
function hidePopup(){clearInterval(popupInt);popup.style.display="none";}

/* UI */
function render(){
 route.innerHTML=""; endSelect.innerHTML="";
 for(let i=cur;i<=end;i++){
  let li=document.createElement("li");
  li.textContent=stops[i].name;
  if(i===cur)li.className="current";
  if(i===cur+1)li.className="next";
  if(i===end)li.className="end";
  route.appendChild(li);

  let o=document.createElement("option");
  o.value=i;o.textContent=stops[i].name;
  if(i===end)o.style.color="orange";
  endSelect.appendChild(o);
 }
 currentStop.textContent=stops[cur].name;
}
endSelect.onchange=e=>{end=+e.target.value;render();};
render();

/* GPS */
navigator.geolocation.watchPosition(p=>{
 let h={lat:p.coords.latitude,lon:p.coords.longitude};
 let d=Math.hypot(h.lat-stops[cur].lat,h.lon-stops[cur].lon);

 if(d<=CURRENT_RADIUS && !stopDone){
  stopDone=true;nextDone=false;
  label.textContent="Спирка / Bus stop";
  if(audio){
   let s=["stop.mp3",stops[cur].file+".mp3"];
   if(cur===end)s.push("your_stop.mp3");
   playSeq(s);
  }
  hidePopup();
 }

 if(d>=LEAVE_RADIUS && stopDone){
  let n=cur+1;
  if(n<=end && !nextDone){
   nextDone=true;cur=n;stopDone=false;
   label.textContent="Следваща спирка / Next stop";
   if(audio){
    let s=["next_stop.mp3",stops[cur].file+".mp3"];
    if(cur===end){s.push("your_stop.mp3");showPopup();}
    playSeq(s);
   }
   render();
  }
 }
},{},{enableHighAccuracy:true});
</script>

</body>
</html>
