/* ===================== LOGIC ===================== */

const dirSel=document.getElementById("directionSelect");
const targetSel=document.getElementById("targetSelect");
const stopsDiv=document.getElementById("stops");
const label=document.getElementById("label");
const labelName=document.getElementById("labelName");
const popup=document.getElementById("popup");

let route=[],currentIndex=-1,nextIndex=0,targetIndex=null,watchId=null;

function playSeq(list){
let i=0;
function p(){
if(i>=list.length)return;
const a=new Audio(list[i++]);
a.onended=p;a.play();
}
p();
}

function renderStops(){
stopsDiv.innerHTML="";
targetSel.innerHTML='<option value="">Избери крайна спирка</option>';
route.forEach((s,i)=>{
if(targetIndex!==null && i>targetIndex)return;
const d=document.createElement("div");
d.className="stop";
if(i===currentIndex)d.classList.add("current");
if(i===nextIndex)d.classList.add("next");
if(i===targetIndex)d.classList.add("target");
d.textContent=s.name;
stopsDiv.appendChild(d);
const o=document.createElement("option");
o.value=i;o.text=s.name;
targetSel.appendChild(o);
});
}

dirSel.onchange=()=>{
route=routes[dirSel.value];
playSeq(["line.mp3","71.mp3","direction.mp3",dirSel.value+".mp3"]);
renderStops();
startGPS();
};

targetSel.onchange=()=>{
targetIndex=parseInt(targetSel.value);
renderStops();
};

function dist(a,b,c,d){
const R=6371e3;
const p=Math.PI/180;
const x=(c-a)*p;
const y=(d-b)*p;
return Math.sqrt(x*x+y*y)*R;
}

function startGPS(){
if(watchId)navigator.geolocation.clearWatch(watchId);
watchId=navigator.geolocation.watchPosition(pos=>{
const lat=pos.coords.latitude;
const lon=pos.coords.longitude;
route.forEach((s,i)=>{
const d=dist(lat,lon,s.lat,s.lon);
if(d<=10 && currentIndex!==i){
currentIndex=i;
nextIndex=i+1;
label.textContent="СПИРКА / BUS STOP";
labelName.textContent=s.name;
playSeq(["stop.mp3",s.a+".mp3"]);
renderStops();
}
if(currentIndex===i && d>=5 && nextIndex===i+1){
label.textContent="СЛЕДВАЩА СПИРКА / NEXT STOP";
labelName.textContent=route[nextIndex]?.name||"";
playSeq(["next_stop.mp3",route[nextIndex].a+".mp3"]);
if(nextIndex===targetIndex){
playSeq(["your_stop.mp3"]);
showPopup();
}
}
});
},{enableHighAccuracy:true,maximumAge:0,timeout:10000});
}

function showPopup(){
popup.style.display="block";
let bg=true;
setInterval(()=>{
popup.textContent=bg?
"СЛЕДВАЩАТА СПИРКА Е ВАШАТА. МОЛЯ СИГНАЛИЗИРАЙТЕ СТОП ИЛИ ВРАТА":
"NEXT STOP IS YOURS. PLEASE PRESS STOP OR DOOR BUTTON";
bg=!bg;
},7000);
}
