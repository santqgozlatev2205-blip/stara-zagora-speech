let aq=[],playing=false;
function playQueue(list){
 aq.push(...list);
 if(!playing) playNext();

function playNext(){
 if(!aq.length){playing=false;return;}
 playing=true;
 const a=new Audio(aq.shift());
 a.onended=playNext;
 a.play().catch(()=>{});
}

/* ---------------- DISTANCE ---------------- */
function dist(a,b){
 const R=6371000;
 const dLat=(b.lat-a.lat)*Math.PI/180;
 const dLon=(b.lon-a.lon)*Math.PI/180;
 const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
 const x=Math.sin(dLat/2)**2+
 Math.sin(dLon/2)**2*Math.cos(la1)*Math.cos(la2);
 return 2*R*Math.asin(Math.sqrt(x));
}

targetSel.onchange=()=>{targetIndex=parseInt(targetSel.value);renderStops();};

function renderStops(){
 stopsDiv.innerHTML="";
 targetSel.innerHTML="<option value=''>Избери крайна спирка</option>";
 const start=(currentIndex<0?0:currentIndex);
 route.forEach((s,i)=>{
  if(i<start)return;
  if(targetIndex!==null && i>targetIndex)return;
  let row=document.createElement("div");
  row.className="stopRow";
  let arr=document.createElement("div");
  arr.className="stopArrow";
  let txt=document.createElement("div");
  txt.className="stop";
  if(i===currentIndex)txt.classList.add("current");
  else if(i===nextIndex)txt.classList.add("next");
  else if(i===targetIndex)txt.classList.add("target");
  txt.innerText=s.name;
  row.appendChild(arr);
  row.appendChild(txt);
  stopsDiv.appendChild(row);
  let o=document.createElement("option");
  o.value=i;o.text=s.name;
  targetSel.appendChild(o);
 });
}

function startGPS(){
 if(watchId)navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(onPos,()=>{},{
  enableHighAccuracy:true,
  maximumAge:0,
  timeout:5000,
  distanceFilter:1
 });
}

function onPos(p){
 const me={lat:p.coords.latitude,lon:p.coords.longitude};
 route.forEach((s,i)=>{
  const d=dist(me,s);
  // текуща спирка – радиус 10 м
  if(d<=10&&currentIndex!==i){
   currentIndex=i;nextIndex=i+1;
   const isFinal=(i===targetIndex);
   label.className="current";label.innerText="СПИРКА / BUS STOP";labelName.innerText=s.name;
   const queue=["stop.mp3",s.a+".mp3"];if(isFinal)queue.push("your_stop.mp3");
   playQueue(queue);notifyUser("Спирка",s.name,isFinal);
   if(isFinal)showFinalPopup();
   renderStops();
  }
  // следваща спирка – радиус над 5 м от текущата
  if(currentIndex===i&&d>=5&&nextIndex!==i+1&&i+1<route.length){
   nextIndex=i+1;
   const ns=route[nextIndex];
   const isFinal=(nextIndex===targetIndex);
   label.className="next";label.innerText="СЛЕДВАЩА СПИРКА / NEXT STOP";labelName.innerText=ns.name;
   const queue=["next_stop.mp3",ns.a+".mp3"];if(isFinal)queue.push("your_stop.mp3");
   playQueue(queue);notifyUser("Следваща спирка",ns.name,isFinal);
   if(isFinal)showFinalPopup();
   renderStops();
  }
 });
}

function notifyUser(title,body,isFinal){
  if(!navigator.serviceWorker?.controller) return;
  if(Notification.permission!=='granted') return;
  const audioFile=isFinal?'your_stop.mp3':(title==='Спирка'?'stop.mp3':'next_stop.mp3');
  navigator.serviceWorker.controller.postMessage({type:'PLAY',file:audioFile});
  navigator.serviceWorker.controller.postMessage({type:'PUSH',title,body});
}

function showFinalPopup(){
 if(popupInterval)return;
 const p=document.getElementById("popup");
 let bg=true;
 p.style.display="block";
 popupInterval=setInterval(()=>{
  p.innerText=bg
   ?"МОЛЯ, НАТИСНЕТЕ БУТОНА СТОП ИЛИ ВРАТА ЗА ДА СИГНАЛИЗИРАТЕ НА ШОФЬОРА"
   :"PLEASE PRESS THE STOP OR DOOR BUTTON TO SIGNAL THE DRIVER";
  bg=!bg;
 },7000);
}

/* ---------------- CLOCK BG/EN ---------------- */
const daysBg=["Неделя","Понеделник","Вторник","Сряда","Четвъртък","Петък","Събота"];
const daysEn=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const monthsBg=["януари","февруари","март","април","май","юни","юли","август","септември","октомври","ноември","декември"];
const monthsEn=["January","February","March","April","May","June","July","August","September","October","November","декември"];

let langClock=true;
setInterval(()=>{
 const now=new Date();
 const d=langClock?daysBg[now.getDay()]:daysEn[now.getDay()];
 const m=langClock?monthsBg[now.getMonth()]:monthsEn[now.getMonth()];
 const str=`${now.getDate()} ${m} ${now.getFullYear()} г. – ${d} – ${now.toLocaleTimeString("bg-BG")}`;
 document.getElementById("clock").innerText=str;
 langClock=!langClock;
},3000);

navigator.serviceWorker.register('sw.js').then(reg=>{
 reg.addEventListener('updatefound',()=>{
   const newWorker=reg.installing;
   newWorker.addEventListener('statechange',()=>{
     if(newWorker.state==='activated'&&navigator.serviceWorker.controller){
       window.location.reload();
     }
   });
 });
});

/* --- приемаме звук от SW --- */
navigator.serviceWorker.addEventListener('message',e=>{
 if(e.data.type==='PLAY'){
   const a=new Audio(e.data.file);
   a.play().catch(()=>{});
 }
});
</script>
