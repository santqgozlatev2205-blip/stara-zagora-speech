/* ---------------- СЪСТОЯНИЕ ---------------- */

let currentIndex=-1;
let targetIndex=null;
let watchId=null;
let popupTimer=null;

/* ---------------- UI ---------------- */
const dirSel=document.getElementById("directionSelect");
const targetSel=document.getElementById("targetSelect");

dirSel.onchange=()=>{
 startRoute(dirSel.value);
};

function startRoute(dir){
 active=routes[dir];
 currentIndex=-1;
 targetIndex=null;

 document.getElementById("directionText").innerText=
 dir==="zora_jheleznik"
 ?"кв. Зора → кв. Железник през Стадион Берое"
 :"кв. Железник → кв. Зора през Стадион Берое";

 playSeq(["line","71","direction",directionAudio[dir]]);
 renderStops();
 startGPS();
}

function renderStops(){
 const c=document.getElementById("stops");
 targetSel.innerHTML="<option value=''>Избери крайна спирка</option>";
 c.innerHTML="";
 active.forEach((s,i)=>{
  let d=document.createElement("div");
  d.className="stop";
  d.innerText=s.name;
  c.appendChild(d);
  let o=document.createElement("option");
  o.value=i;o.text=s.name;
  targetSel.appendChild(o);
 });
}

targetSel.onchange=()=>{
 targetIndex=parseInt(targetSel.value);
 updateUI();
};

/* ---------------- GPS ---------------- */
function distance(lat1,lon1,lat2,lon2){
 const R=6371000;
 const dLat=(lat2-lat1)*Math.PI/180;
 const dLon=(lon2-lon1)*Math.PI/180;
 const a=Math.sin(dLat/2)**2+
 Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
 Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function startGPS(){
 if(watchId) navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(p=>{
  checkStops(p.coords.latitude,p.coords.longitude);
 },null,{enableHighAccuracy:true});
}

function checkStops(lat,lon){
 active.forEach((s,i)=>{
  const d=distance(lat,lon,s.lat,s.lon);

  if(d<=10 && i!==currentIndex){
   currentIndex=i;
   document.getElementById("status").innerText="СПИРКА / BUS STOP";
   document.getElementById("stopName").innerText=s.name;
   playSeq(["stop",s.a]);
   updateUI();
  }

  if(i===currentIndex+1 && d<=5){
   document.getElementById("status").innerText="СЛЕДВАЩА СПИРКА / NEXT STOP";
   document.getElementById("stopName").innerText=s.name;
   playSeq(["next_stop",s.a]);

   if(i===targetIndex){
    playSeq(["your_stop"]);
    showPopup();
   }
   updateUI();
  }
 });
}

/* ---------------- UI UPDATE ---------------- */
function updateUI(){
 const nodes=document.querySelectorAll(".stop");
 nodes.forEach((d,i)=>{
  d.style.display="none";
  if(
   (targetIndex===null && i>=currentIndex)||
   (targetIndex!==null && i>=currentIndex && i<=targetIndex)
  ){
   d.style.display="block";
  }
  d.className="stop";
  if(i===currentIndex)d.classList.add("current");
  if(i===currentIndex+1)d.classList.add("next");
  if(i===targetIndex)d.classList.add("target");
 });
}

/* ---------------- POPUP ---------------- */
function showPopup(){
 if(popupTimer) return;
 const p=document.getElementById("popup");
 let bg=true;
 p.style.display="block";
 popupTimer=setInterval(()=>{
  p.innerText=bg
   ?"СЛЕДВАЩАТА СПИРКА Е ВАШАТА. МОЛЯ НАТИСНЕТЕ БУТОНА СТОП ИЛИ ВРАТА."
   :"THE NEXT STOP IS YOURS. PLEASE PRESS STOP OR DOOR BUTTON.";
  bg=!bg;
 },7000);
}
